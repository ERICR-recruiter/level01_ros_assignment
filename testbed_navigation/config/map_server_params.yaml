# map_server only needs to know where the map yaml is and which frame to stamp it with.
# yaml_filename is left empty on purpose - map_loader.launch.py fills it in with the
# installed path of testbed_bringup/maps/testbed_world.yaml (or whatever you pass as map:=)
map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""
    topic_name: map
    frame_id: map
