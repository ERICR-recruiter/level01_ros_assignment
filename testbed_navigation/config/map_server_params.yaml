# ---------------------------------------------------------------------------
# map_server (nav2_map_server) - serves the static occupancy grid on /map.
# The map yaml path is filled in by map_loader.launch.py (launch arg `map`)
# so the same file works regardless of where the workspace is installed.
# ---------------------------------------------------------------------------
map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""          # overridden from map_loader.launch.py
    topic_name: "map"
    frame_id: "map"
