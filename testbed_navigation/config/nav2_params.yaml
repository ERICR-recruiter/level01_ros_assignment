# ---------- The "brain": runs the default navigate_to_pose behaviour tree ----------
bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    # No BT file given -> Nav2's default tree (plan, follow, replan, recover)

# ---------- Global planner: whole path from robot to goal ----------
planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5          # accept a goal up to 0.5 m off if exact spot is blocked
      use_astar: false        # Dijkstra; A* would also work
      allow_unknown: true

# ---------- Local controller: follow the path, output /cmd_vel ----------
controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:         # "stuck" = moved < 0.5 m in 10 s -> triggers recovery
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    general_goal_checker:     # goal reached = within 0.25 m and 0.25 rad
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      stateful: true

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.2           # modest speed for a small robot in a small room
      lookahead_dist: 0.6               # chase a point 0.6 m ahead on the path
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      rotate_to_heading_angular_vel: 0.5
      use_rotate_to_heading: true       # turn on the spot first if facing the wrong way
      rotate_to_heading_min_angle: 0.785
      use_collision_detection: true
      transform_tolerance: 0.1

# ---------- Recovery behaviours used by the default tree ----------
behavior_server:
  ros__parameters:
    use_sim_time: true
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.5
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

# ---------- Local costmap: small window around the robot, in odom ----------
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom              # odom is smooth, no AMCL jumps
      robot_base_frame: base_footprint
      update_frequency: 5.0
      publish_frequency: 2.0
      rolling_window: true            # window moves with the robot
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.25              # covers the casters (base_link is off-centre)
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          marking: true
          clearing: true
          max_obstacle_height: 2.0
          obstacle_max_range: 2.5
          raytrace_max_range: 3.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.35         # keep paths about 0.5 m from walls
        cost_scaling_factor: 5.0
      always_send_full_costmap: true

# ---------- Global costmap: whole map, in map frame ----------
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_footprint
      update_frequency: 1.0
      publish_frequency: 1.0
      resolution: 0.05
      robot_radius: 0.25
      track_unknown_space: true
      plugins: ["static_layer", "inflation_layer"]
      static_layer:                   # walls from /map
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:                 # anything new the lidar sees
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          marking: true
          clearing: true
          max_obstacle_height: 2.0
          obstacle_max_range: 9.5     # just under the 10 m lidar range (bug 5 fix)
          raytrace_max_range: 10.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.35
        cost_scaling_factor: 5.0
      always_send_full_costmap: true
