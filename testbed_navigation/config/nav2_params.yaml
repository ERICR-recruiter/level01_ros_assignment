# Nav2 (Humble) parameters for Testbed-T1.0.0
#
#   bt_navigator      : receives the goal (NavigateToPose action) and runs the default
#                       behaviour tree: plan -> follow path -> recover if stuck
#   planner_server    : makes the global path on the global costmap   (plugin: NavFn)
#   controller_server : follows that path, publishes /cmd_vel           (plugin: Regulated Pure Pursuit)
#   behavior_server   : recovery moves used by the tree                 (spin, backup, wait)
#
# Robot footprint (in base_footprint frame, from the URDF mesh sizes): 0.36 m long x 0.42 m wide

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    # no BT xml / plugin list given -> Nav2 default tree
    # (navigate_to_pose_w_replanning_and_recovery.xml) and default BT plugins are used

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    odom_topic: /odom
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:                     # "stuck" if it does not move 0.5 m in 10 s
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    goal_checker:                         # goal reached when within 0.25 m and 0.25 rad
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25

    FollowPath:                           # pure pursuit: chase a point 0.6 m ahead on the path
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.4
      lookahead_dist: 0.6
      use_rotate_to_heading: true         # first turn in place towards the path (diff drive)
      rotate_to_heading_angular_vel: 1.0
      use_collision_detection: true

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true                # 3 m x 3 m window that moves with the robot
      width: 3
      height: 3
      resolution: 0.05
      update_frequency: 5.0
      publish_frequency: 2.0
      footprint: "[[0.18, 0.21], [0.18, -0.21], [-0.18, -0.21], [-0.18, 0.21]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:                     # obstacles from the lidar
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          marking: true
          clearing: true
      inflation_layer:                    # keep-away zone around obstacles
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.45
        cost_scaling_factor: 3.0

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_footprint
      resolution: 0.05
      update_frequency: 1.0
      publish_frequency: 1.0
      footprint: "[[0.18, 0.21], [0.18, -0.21], [-0.18, -0.21], [-0.18, 0.21]]"
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:                       # walls from /map
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          marking: true
          clearing: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.45
        cost_scaling_factor: 3.0

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"   # Dijkstra on the costmap
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    global_frame: odom
    robot_base_frame: base_footprint
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"
