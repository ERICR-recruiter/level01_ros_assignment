# Nav2 settings for the Testbed-T1.0.0.
# Frames: map -> odom -> base_footprint.

# Global costmap
global_costmap:

  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 4.0
      publish_frequency: 2.0
      global_frame_id: map
      robot_base_frame: base_footprint

      footprint: "[[-0.175, -0.150], [0.175, -0.150], [0.175, 0.150], [-0.175, 0.150]]"

      plugins: ["static_layer", "obstacle_layer", "voxel_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          marking: True
          clearing: True
          inf_is_valid: True
        obstacle_max_range: 8.0
        obstacle_min_range: 0.0
        raytrace_max_range: 10.0
        footprint_clearing_enabled: True
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: False
        publish_voxel_map: False
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55

# Local costmap
local_costmap:

  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame_id: odom
      robot_base_frame: base_footprint
      rolling_window: true

      width: 6
      height: 6
      resolution: 0.05

      footprint: "[[-0.175, -0.150], [0.175, -0.150], [0.175, 0.150], [-0.175, 0.150]]"

      always_send_full_costmap: False

      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          marking: True
          clearing: True
          inf_is_valid: True
        obstacle_max_range: 4.0
        obstacle_min_range: 0.0
        raytrace_max_range: 5.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.45

# Planner
planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 5.0
    planner_plugins: ["NavFn"]
    NavFn:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.6
      use_astar: False
      allow_unknown: True

# Controller
controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    controller_plugins: ["FollowPath"]
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    current_progress_checker: "progress_checker"
    current_goal_checker: "goal_checker"
    controller_plugins_timeout: 5.0
    progress_checker_plugin_timeout: 5.0
    goal_checker_plugin_timeout: 5.0

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.25
      movement_time_allowance: 20.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.4
      yaw_goal_tolerance: 0.25
      stateful: True

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      debug: False

      desired_linear_vel: 0.8

      lookahead_dist: 0.7
      lookahead_time: 1.0
      max_lookahead_dist: 2.0
      min_lookahead_dist: 0.35
      use_velocity_scaled_lookahead_dist: False

      max_angular_accel: 2.0
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_collision_detection: True
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6

      use_regulated_linear_velocity_scaling: True
      regulated_linear_scaling_min_radius: 0.4
      regulated_linear_scaling_min_speed: 0.2
      use_cost_regulated_linear_velocity_scaling: False
      inflation_cost_scaling_factor: 3.0

      allow_reversing: False
      use_rotate_to_heading: True
      rotate_to_heading_angular_vel: 1.0
      rotate_to_heading_min_angle: 0.785

      use_interpolation: True
      transform_tolerance: 0.1
      cost_scaling_dist: 0.6
      cost_scaling_gain: 1.0

# Recovery behaviors
behavior_server:
  ros__parameters:
    use_sim_time: true
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"

# Behavior-tree navigator
bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10

    wait_for_service_timeout: 20

    action_server_result_timeout: 900

# Velocity smoother
velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: OPEN_LOOP
    max_velocity: [0.8, 0.0, 2.0]
    min_velocity: [-0.4, 0.0, -2.0]
    max_accel: [1.5, 0.0, 3.0]
    max_decel: [-1.5, 0.0, -3.0]
    odom_topic: /odom
    odom_duration: 0.2
    deadband_velocity: [0.0, 0.0, 0.05]
    # Gazebo holds the last Twist, so stop as soon as input times out.
    velocity_timeout: 0.25
