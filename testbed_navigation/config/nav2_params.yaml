# Behaviour tree navigator
# ========================
bt_navigator:
  # high level behavior tree navigator (coordinator)
  ros__parameters:
    # gazebo sim clock
    use_sim_time: true

    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    
    bt_loop_duration: 10  # 10 ms cycle duration for the bt to run
    default_server_timeout: 20

# Recovery behaviours
# ===================
behavior_server:
  ros__parameters:
    use_sim_time: true

    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.1  # 100ms of transform tolerance

    behavior_plugins:
      - spin
      - backup
      - drive_on_heading
      - wait

    spin:
      plugin: "nav2_behaviors/Spin"

    backup:
      plugin: "nav2_behaviors/BackUp"

    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"

    wait:
      plugin: "nav2_behaviors/Wait"

# Global planner
# ==============
planner_server:
  ros__parameters:
    use_sim_time: true

    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"

      # Acceptable distance between the computed path endpoint
      # and the requested goal
      tolerance: 0.5 # default: 0.5

      # use Dijkstra's algorithm
      use_astar: false 
      # allow planning through unknown map regions
      allow_unknown: true

# Local controller
# ================
controller_server:
  ros__parameters:
    use_sim_time: true

    controller_frequency: 20.0  # default: 20.0

    # ignore very small vel commands/noise
    min_x_velocity_threshold: 0.001 # default: 0.0001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001

    progress_checker_plugin: "progress_checker"  # default: "progress_checker"
    goal_checker_plugins: ["goal_checker"]  # default: ["goal_checker"]
    controller_plugins: ["FollowPath"]  # default: ["FollowPath"]

    # Progress checker parameters
    # ---------------------------
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    # Goal checker parameters
    # -----------------------
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.15
      stateful: true
    
    # DWB local planner parameters
    # ----------------------------
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"

      debug_trajectory_details: false # default: false

      # diff drive vel limits
      min_vel_x: 0.00
      max_vel_x: 0.26
      min_vel_y: 0.00 
      max_vel_y: 0.00  # diff drive robot, no lateral movement
      min_vel_theta: -1.0
      max_vel_theta: 1.0
      min_speed_xy: 0.0
      max_speed_xy: 0.26

      # acceleration limits
      acc_lim_x: 2.5
      acc_lim_y: 0.0
      acc_lim_theta: 3.2
      # deceleration limits
      decel_lim_x: -2.5
      decel_lim_y: 0.0
      decel_lim_theta: -3.2

      # velocity samples evaluated by DWB
      vx_samples: 20
      vy_samples: 1
      vtheta_samples: 40

      sim_time: 1.7

      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.15

      trans_stopped_velocity: 0.1
      short_circuit_trajectory_evaluation: true
      stateful: true

      # Trajectory deciding critics
      # ---------------------------
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      # critic weights
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0


# Velocity Smoother
# =================
velocity_smoother:
  ros__parameters:
    use_sim_time: true

    # smooth velocity commands generated by the controller
    smoothing_frequency: 20.0
    scale_velocities: false

    feedback: "OPEN_LOOP"

    max_velocity: [0.26, 0.0, 1.0]
    min_velocity: [-0.26, 0.0, -1.0]

    deadband_velocity: [0.0, 0.0, 0.0]

    velocity_timeout: 1.0

    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]

    odom_topic: /odom
    odom_duration: 0.1

    # use geometry_msgs/Twist instead of TwistStamped
    enable_stamped_cmd_vel: false   
    
# Global costmap
# ==============
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true

      global_frame: map # fixed to the map frame
      robot_base_frame: base_footprint

      update_frequency: 5.0
      publish_frequency: 2.0

      resolution: 0.05  # default: 0.05, 5cmx5cm grid cells
      track_unknown_space: true # default: false

      # circular appx of the robot footprint
      # used for inflation and obstacle avoidance
      robot_radius: 0.24  # default: 0.1

      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      # static map layer
      # ----------------
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true

      # to replan the global path around dynamic obstacles
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: "scan" # obstacle observation from LaserScan

        scan:
          topic: /scan
          data_type: LaserScan
          marking: true
          clearing: true  # clear old obstacle markings
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          inf_is_valid: true

      # obstacle inflation
      # ------------------
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 6.0
        inflation_radius: 0.45

# Local costmap
# =============
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true

      global_frame: odom  # local costmap is expressed in the odom frame
      robot_base_frame: base_footprint

      update_frequency: 10.0
      publish_frequency: 5.0

      # local costmap follows the robot
      rolling_window: true  # rolls with the robot as it moves
      width: 6
      height: 6 # 6mx6m local costmap
      resolution: 0.05

      # circular appx of the robot footprint
      robot_radius: 0.24  # default: 0.1

      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"

        observation_sources: "scan" # obstacle observation from LaserScan

        scan:
          topic: /scan
          data_type: LaserScan
          marking: true
          clearing: true  # clear old obstacle markings
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          inf_is_valid: true

      # obstacle inflation
      # ------------------
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 6.0
        inflation_radius: 0.45