# =============================================================================
#  Nav2 navigation parameters for Testbed-T1.0.0
#
#  Servers started by navigation.launch.py and the plugin each one loads:
#
#    bt_navigator       -> NavigateToPose / NavigateThroughPoses actions,
#                          default BT: navigate_to_pose_w_replanning_and_recovery
#    planner_server     -> "GridBased"  : nav2_navfn_planner/NavfnPlanner
#    controller_server  -> "FollowPath" : RegulatedPurePursuitController
#    behavior_server    -> spin / backup / drive_on_heading / wait
#    velocity_smoother  -> limits accel/vel of the controller output
#    collision_monitor  -> last safety layer before /cmd_vel
#
#  Velocity pipeline:
#    controller_server, behavior_server --/cmd_vel_nav--> velocity_smoother
#      --/cmd_vel_smoothed--> collision_monitor --/cmd_vel--> Gazebo diff drive
#
#  Robot geometry (base_footprint = centre of the wheel axle):
#    body is 0.35 m (x) x 0.405 m (y), lidar on top at ~(0.01, 0.0, 0.228)
# =============================================================================

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 20          # [ms] BT tick period (10 ms was too tight under GUI load)
    default_server_timeout: 100   # [ms] wait for action servers to accept a goal
    # Behaviour trees: testbed_navigation/behavior_trees/*.xml.
    # navigation.launch.py fills in the absolute install paths of
    #   default_nav_to_pose_bt_xml       -> navigate_to_pose_w_replanning_and_recovery.xml
    #   default_nav_through_poses_bt_xml -> navigate_through_poses_w_replanning_and_recovery.xml
    # BT node plugins the trees above are allowed to use
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: true

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: true

# -----------------------------------------------------------------------------
# Global planner
# -----------------------------------------------------------------------------
planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 1.0   # the BT replans at 1 Hz
    planner_plugins: ["GridBased"]   # id used by the BT (planner_id="GridBased")
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5        # [m] goal may be this far from a free cell
      use_astar: false      # Dijkstra - complete & cheap on a 20 m x 20 m map
      allow_unknown: true

# -----------------------------------------------------------------------------
# Local controller
# -----------------------------------------------------------------------------
controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    odom_topic: odom
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]  # id used by the BT (controller_id="FollowPath")

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 0.25

    # Regulated Pure Pursuit: simple, predictable path tracker for a
    # differential-drive robot. Rotates in place towards the path first.
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.3
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: false
      transform_tolerance: 0.2
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      use_rotate_to_heading: true
      rotate_to_heading_angular_vel: 1.0
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 3.2
      allow_reversing: false
      max_robot_pose_search_dist: 10.0

# -----------------------------------------------------------------------------
# Costmaps
#
# Both costmaps use the static map + inflation. Live laser data is NOT fed into
# the costmaps: in ROS 2 Humble (tf2_ros 0.25.x) the costmap ObstacleLayer's
# tf2 MessageFilter can deadlock the costmap's TF listener thread
# (tf2_ros::Buffer::waitForTransform holds its timer mutex while calling
# BufferCore::addTransformableRequest, while the listener thread holds the
# request mutex and calls back into waitForTransform's lambda). Captured with
# gdb on this setup; symptom: the costmap robot pose freezes and goals fail
# with "Controller patience exceeded" / "Resulting plan has 0 poses".
# The robot still reacts to unmapped obstacles through the collision_monitor,
# which reads /scan directly (no MessageFilter) and slows/stops the robot.
# -----------------------------------------------------------------------------
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      transform_tolerance: 0.3
      # Rectangle around base_footprint, ~1.5 cm padding on each side
      footprint: "[[0.19, 0.215], [0.19, -0.215], [-0.19, -0.215], [-0.19, 0.215]]"
      footprint_padding: 0.0
      # Static map + inflation (no ObstacleLayer), see the note above.
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.50
        cost_scaling_factor: 4.0
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      resolution: 0.05
      track_unknown_space: true
      transform_tolerance: 0.3
      footprint: "[[0.19, 0.215], [0.19, -0.215], [-0.19, -0.215], [-0.19, 0.215]]"
      # Static map + inflation (no ObstacleLayer), see the note above.
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true   # /map comes from map_loader.launch.py
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.50
        cost_scaling_factor: 4.0
      always_send_full_costmap: true

# -----------------------------------------------------------------------------
# Recovery behaviours used by the BT (Spin, BackUp, Wait)
# -----------------------------------------------------------------------------
behavior_server:
  ros__parameters:
    use_sim_time: true
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

# -----------------------------------------------------------------------------
# Velocity smoother: cmd_vel_nav -> cmd_vel_smoothed
# -----------------------------------------------------------------------------
velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.35, 0.0, 1.2]
    min_velocity: [-0.35, 0.0, -1.2]
    max_accel: [1.5, 0.0, 3.2]
    max_decel: [-1.5, 0.0, -3.2]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

# -----------------------------------------------------------------------------
# Collision monitor: cmd_vel_smoothed -> cmd_vel
# Uses the robot footprint to slow the robot so that it never reaches an
# obstacle within `time_before_collision` seconds at the current command.
# -----------------------------------------------------------------------------
collision_monitor:
  ros__parameters:
    use_sim_time: true
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    transform_tolerance: 0.5
    source_timeout: 5.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 1.2
      simulation_time_step: 0.1
      max_points: 3
      visualize: false
      enabled: true
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "/scan"
      enabled: true
