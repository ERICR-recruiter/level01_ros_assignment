global_costmap:
  global_costmap:
    ros__parameters:

      use_sim_time: true #Use Gazebo's simulated clock
        
      global_frame: map # Global frame used by the costmap
      robot_base_frame: base_footprint # Robot base frame used by the costmap

      initial_transform_timeout: 10.0 # Time to wait for the initial transform between the global frame and robot base frame

      update_frequency: 5.0 # Frequency at which the costmap is updated
      publish_frequency: 2.0 # Frequency at which the costmap is published

      resolution: 0.05 # Resolution of the costmap in meters per cell

      rolling_window: false # Keep the costmap fixed to the global map

      plugins:
        - static_layer
        - inflation_layer

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer" # Uses the static occupancy map to populate the costmap
        map_subscribe_transient_local: true # Receive the latched /map topic from the map server

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer" # Adds cost around obstacles
        inflation_radius: 0.55 # Distance around obstacles to inflate the costmap
        cost_scaling_factor: 10.0 # Rate at which inflation cost decreases

planner_server:
  ros__parameters:

    use_sim_time: true

    planner_plugins:
      - GridBased

    GridBased:
      plugin: 'nav2_navfn_planner/NavfnPlanner' # Uses Dijkstra's algorithm to compute the shortest path
      tolerance: 0.5 # Acceptable distance from the goal to consider the plan successful
      use_astar: false # Use A* algorithm instead of Dijkstra's algorithm
      allow_unknown: true # Allow planning through unknown space

controller_server:
  ros__parameters:
    use_sim_time: true

    controller_frequency: 20.0

    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001

    failure_tolerance: 0.3

    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    # Progress checker
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    # Goal checker
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      stateful: true

    # DWB local planner
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: true

      # Differential-drive velocity limits (m/s, rad/s)
      min_vel_x: 0.0
      max_vel_x: 0.20
      min_vel_y: 0.0
      max_vel_y: 0.0
      max_vel_theta: 1.0

      min_speed_xy: 0.0
      max_speed_xy: 0.20
      min_speed_theta: 0.0

      # Acceleration and deceleration limits
      acc_lim_x: 2.5
      acc_lim_y: 0.0
      acc_lim_theta: 3.2
      decel_lim_x: -2.5
      decel_lim_y: 0.0
      decel_lim_theta: -3.2

      # Trajectory sampling
      vx_samples: 20
      vy_samples: 1
      vtheta_samples: 20

      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2

      xy_goal_tolerance: 0.25
      trans_stopped_velocity: 0.25

      short_circuit_trajectory_evaluation: true
      stateful: true

      # Trajectory critics
      critics:
        - "RotateToGoal"
        - "Oscillation"
        - "BaseObstacle"
        - "GoalAlign"
        - "PathAlign"
        - "PathDist"
        - "GoalDist"

      BaseObstacle.scale: 0.02

      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1

      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1

      PathDist.scale: 32.0
      GoalDist.scale: 24.0

      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0


local_costmap:
  local_costmap:
    ros__parameters:

      # Use Gazebo's simulation clock instead of the system clock.
      use_sim_time: true

      # How frequently the costmap updates its internal representation (Hz).
      update_frequency: 5.0

      # How frequently the costmap publishes its updated map (Hz).
      publish_frequency: 2.0

      # Coordinate frame in which the local costmap is maintained.
      # odom is continuous and suitable for a rolling local costmap.
      global_frame: odom

      # Robot's reference frame used to position the costmap around the robot.
      robot_base_frame: base_footprint

      # Keep the costmap centered around the robot as it moves.
      rolling_window: true

      # Width of the local costmap in meters.
      width: 3

      # Height of the local costmap in meters.
      height: 3

      # Size of each costmap cell in meters (5 cm per cell).
      resolution: 0.05

      # Approximate radius of the robot in meters.
      # Replace with the robot's actual radius.
      robot_radius: 0.22

      # Costmap layers to load, in processing order.
      plugins:
        - obstacle_layer
        - inflation_layer

      # --------------------------------------------------
      # OBSTACLE LAYER
      # --------------------------------------------------
      obstacle_layer:

        # Plugin that converts sensor observations into obstacle costs.
        plugin: "nav2_costmap_2d::ObstacleLayer"

        # Enable or disable this layer.
        enabled: true

        # Name of the sensor observation source configured below.
        observation_sources: scan

        # Configuration for the LiDAR observation source.
        scan:

          # ROS topic providing the laser scan data.
          topic: /scan

          # Message type published on the topic.
          data_type: "LaserScan"

          # Add detected obstacles to the costmap.
          marking: true

          # Clear obstacles along the laser beams where no obstacle is detected.
          clearing: true

          # Maximum distance at which detected obstacles are marked (meters).
          obstacle_max_range: 1.2

          # Maximum distance for ray tracing to clear previously marked obstacles.
          raytrace_max_range: 1.4

          # Maximum obstacle height considered by the layer (meters).
          max_obstacle_height: 2.0

      # --------------------------------------------------
      # INFLATION LAYER
      # --------------------------------------------------
      inflation_layer:

        # Plugin that adds a safety-cost region around obstacles.
        plugin: "nav2_costmap_2d::InflationLayer"

        # Controls how quickly the inflation cost decreases with distance.
        # Higher values cause the cost to decay more rapidly.
        cost_scaling_factor: 3.0

        # Distance around obstacles over which inflation costs are applied (meters).
        inflation_radius: 0.25


behavior_server:
  ros__parameters:
    use_sim_time: true  # Use Gazebo simulation time
    cycle_frequency: 10.0  # Behavior server execution frequency (Hz)

    global_frame: odom  # Reference frame for behavior execution
    robot_base_frame: base_footprint  # Robot's base frame
    transform_tolerance: 0.1  # Allowed TF timestamp tolerance (seconds)
    simulate_ahead_time: 2.0  # Time horizon for simulating behavior commands (seconds)

    costmap_topic: local_costmap/costmap_raw  # Local costmap input
    footprint_topic: local_costmap/published_footprint  # Robot footprint input

    # List of behavior plugins to load
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]

    # Rotate the robot in place
    spin:
      plugin: "nav2_behaviors/Spin"

    # Move the robot backward
    backup:
      plugin: "nav2_behaviors/BackUp"

    # Move the robot in a specified direction
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"

    # Pause the robot for a specified duration
    wait:
      plugin: "nav2_behaviors/Wait"


bt_navigator:
  ros__parameters:
    use_sim_time: true  # Use Gazebo simulation time

    global_frame: map  # Global reference frame for navigation
    robot_base_frame: base_footprint  # Robot's base frame
    odom_topic: /odom  # Odometry topic

    bt_loop_duration: 10  # Behavior tree loop period (milliseconds)
    default_server_timeout: 20  # Default action server timeout (milliseconds)
    wait_for_service_timeout: 1000  # Wait time for service availability (milliseconds)

    # Navigation action interfaces to expose
    navigators: ["navigate_to_pose", "navigate_through_poses"]

    # Navigate to a single goal pose
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"

    # Navigate through a sequence of goal poses
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"