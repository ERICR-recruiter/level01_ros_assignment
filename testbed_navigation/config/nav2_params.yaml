# Nav2 navigation stack for Testbed-T1.0.0 (differential drive, 2D lidar)
# Target: ROS 2 Humble (Nav2 1.1.x). Loaded by launch/navigation.launch.py.
# Keys checked against nav2_bringup/params/nav2_params.yaml (tag 1.1.20) and the Humble plugin sources.
#
# Velocity pipeline (remaps are done in the launch file):
#   controller_server / behavior_server --cmd_vel_nav--> velocity_smoother --cmd_vel_smoothed--> collision_monitor --cmd_vel--> Gazebo diff drive
#
# Robot geometry, frame base_footprint (drive-axle center on the ground):
#   body + wheels span x +/-0.175 m, y +/-0.203 m; the footprint below adds ~1.5 cm margin.
#   Inscribed radius 0.19 m, circumscribed radius 0.29 m.
# Map: narrowest doorways are 0.85 m wall-to-wall, leaving ~0.2 m per side for the 0.44 m footprint.

# ---------------------------------------------------------------------------------------------------
# Behavior Tree Navigator: runs the navigate_to_pose / navigate_through_poses actions with a BT
# ---------------------------------------------------------------------------------------------------
bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10                # ms per BT tick
    default_server_timeout: 20          # ms to wait for an action server response per tick
    wait_for_service_timeout: 1000      # ms to wait for BT node services/actions at startup
    # default_nav_to_pose_bt_xml / default_nav_through_poses_bt_xml are unset, so the Humble defaults
    # from nav2_bt_navigator/behavior_trees apply:
    #   navigate_to_pose_w_replanning_and_recovery.xml        (replan at 1 Hz; recoveries: clear costmaps, spin, wait, back up)
    #   navigate_through_poses_w_replanning_and_recovery.xml
    # Those trees reference planner_id "GridBased" and controller_id "FollowPath"; the plugins below match.
    # BT node libraries: the Humble reference list, unchanged. Loading a library only registers its
    # node types; nothing runs unless the tree uses it.
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node

# In Humble each navigator spins an internal rclcpp node that needs its own use_sim_time.
bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: true

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: true

# ---------------------------------------------------------------------------------------------------
# Controller server: follows the global path using the local costmap
# ---------------------------------------------------------------------------------------------------
controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0          # Hz; RPP is cheap, 20 Hz gives smooth tracking
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5       # diff drive: no lateral velocity
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]  # name used by the default BT

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5     # must move 0.5 m...
      movement_time_allowance: 10.0     # ...within 10 s, otherwise the BT starts recoveries

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true                    # once xy is reached, only rotate; avoids dithering at the goal
      xy_goal_tolerance: 0.20           # m; ~half the robot width, tighter than the 0.25 default
      yaw_goal_tolerance: 0.20          # rad; ~11 deg

    # Regulated Pure Pursuit: geometric path tracker with speed regulation near turns and obstacles.
    # Preferred over DWB here: few parameters, no critic weights to balance, and it tracks the
    # planner's path rather than re-optimising it.
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.4           # m/s cruise speed
      lookahead_dist: 0.6
      use_velocity_scaled_lookahead_dist: true  # lookahead = speed * lookahead_time, clamped below
      lookahead_time: 1.5
      min_lookahead_dist: 0.3           # short when slow (doorways): tracks the path tightly
      max_lookahead_dist: 0.9           # long when fast: smooth, less oscillation
      transform_tolerance: 0.2
      # Rotate in place when the path heading differs strongly (diff drive can turn on the spot)
      use_rotate_to_heading: true
      rotate_to_heading_angular_vel: 1.0  # rad/s, equal to the velocity_smoother limit
      rotate_to_heading_min_angle: 0.785  # rad (45 deg)
      max_angular_accel: 3.2            # rad/s^2, equal to the velocity_smoother limit
      allow_reversing: false            # must be false when use_rotate_to_heading is true
      # Slow down on the final approach to the goal
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      # Curvature regulation: slow down in tight turns
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.15
      # Proximity regulation: slow down within cost_scaling_dist of obstacles
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.3
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0  # must equal local_costmap inflation cost_scaling_factor
      # Forward-simulate the command along the arc to the carrot and stop if the footprint would collide
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      max_robot_pose_search_dist: 10.0
      use_interpolation: false          # NavFn paths are dense (one pose per 5 cm cell)

# ---------------------------------------------------------------------------------------------------
# Local costmap: small rolling window in odom used by the controller and behaviors
# ---------------------------------------------------------------------------------------------------
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom                # odom is continuous (no AMCL jumps), good for short-horizon control
      robot_base_frame: base_footprint
      update_frequency: 5.0
      publish_frequency: 2.0
      transform_tolerance: 0.3
      rolling_window: true
      # 3 m x 3 m: 1.5 m each side is ~4 s of travel at 0.4 m/s, well beyond the 0.9 m max lookahead
      width: 3
      height: 3
      resolution: 0.05
      footprint: "[[0.19, 0.22], [0.19, -0.22], [-0.19, -0.22], [-0.19, 0.22]]"
      footprint_padding: 0.0            # margin is already in the polygon
      plugins: ["obstacle_layer", "inflation_layer"]
      # ObstacleLayer (2D) rather than VoxelLayer: the robot only has a single-plane 2D lidar
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          marking: true
          clearing: true
          inf_is_valid: true            # treat "no return" beams as free space up to raytrace range
          max_obstacle_height: 2.0
          obstacle_max_range: 2.5       # m; enough to fill the 3 m window
          obstacle_min_range: 0.0
          raytrace_max_range: 3.0       # clear beyond the marking range so stale obstacles are removed
          raytrace_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Cost decays as 252 * exp(-cost_scaling_factor * (d - inscribed_radius)).
        # Radius 0.55 m, factor 3.0: the center of a 0.85 m doorway (d = 0.425) costs ~124, so doorways
        # stay traversable while paths in open rooms keep clear of walls.
        inflation_radius: 0.55
        cost_scaling_factor: 3.0
      always_send_full_costmap: true

# ---------------------------------------------------------------------------------------------------
# Global costmap: whole map in the map frame, used by the planner
# ---------------------------------------------------------------------------------------------------
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_footprint
      update_frequency: 1.0
      publish_frequency: 1.0
      transform_tolerance: 0.3
      rolling_window: false             # size and origin come from the static map
      resolution: 0.05                  # same as the map, so no resampling
      track_unknown_space: true
      footprint: "[[0.19, 0.22], [0.19, -0.22], [-0.19, -0.22], [-0.19, 0.22]]"
      footprint_padding: 0.0
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true  # map_server publishes /map once with transient-local QoS
      # Adds obstacles missing from the map (e.g. objects spawned in Gazebo) so the planner routes around them
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          marking: true
          clearing: true
          inf_is_valid: true
          max_obstacle_height: 2.0
          obstacle_max_range: 5.0       # m; beyond the local costmap, so long paths avoid new obstacles early
          obstacle_min_range: 0.0
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.55          # same as local, so planner and controller agree on wall clearance
        cost_scaling_factor: 3.0
      always_send_full_costmap: true

# ---------------------------------------------------------------------------------------------------
# Planner server: computes the global path
# ---------------------------------------------------------------------------------------------------
planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]      # name used by the default BT
    # NavFn: wavefront (Dijkstra) expansion over the costmap, then gradient descent for the path.
    # Sufficient for a near-circular diff-drive robot that turns in place; no kinematic planner (Smac Hybrid) needed.
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      use_astar: false                  # Dijkstra: ~160k cells, a full expansion takes only a few ms
      tolerance: 0.5                    # m; if the goal cell is blocked, plan to the nearest free cell within this
      allow_unknown: true
      use_final_approach_orientation: false

# ---------------------------------------------------------------------------------------------------
# Behavior server: recovery behaviors used by the BT (spin, back up, drive on heading, wait)
# ---------------------------------------------------------------------------------------------------
behavior_server:
  ros__parameters:
    use_sim_time: true
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0            # s; collision-check the behavior's motion this far ahead
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

# ---------------------------------------------------------------------------------------------------
# Waypoint follower: drives through a list of poses (FollowWaypoints action)
# ---------------------------------------------------------------------------------------------------
waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false              # skip a failed waypoint and continue with the next one
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200      # ms pause at each waypoint

# ---------------------------------------------------------------------------------------------------
# Velocity smoother: limits velocity and acceleration of the commands, [x, y, theta]
# ---------------------------------------------------------------------------------------------------
velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0           # same rate as the controller
    scale_velocities: false             # clamp each axis independently (curvature kept only approximately; fine at these speeds)
    feedback: "OPEN_LOOP"               # Gazebo diff drive tracks commands closely; open loop avoids odom noise/latency
    max_velocity: [0.4, 0.0, 1.0]       # matches RPP desired_linear_vel and rotate_to_heading_angular_vel
    min_velocity: [-0.2, 0.0, -1.0]     # reversing only for BackUp recovery, kept slow
    # Below the diff drive plugin's 2.0 m/s^2 wheel acceleration limit (~10 rad/s^2 angular),
    # so these limits are always physically achievable.
    max_accel: [1.0, 0.0, 3.2]
    max_decel: [-1.5, 0.0, -3.2]        # braking limit above the acceleration limit
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0               # s; publish zero if no new command arrives

# ---------------------------------------------------------------------------------------------------
# Collision monitor: last safety layer between the smoother and the robot, using raw /scan
# (independent of the costmaps, so it still acts if planning or control is wrong or late)
# ---------------------------------------------------------------------------------------------------
collision_monitor:
  ros__parameters:
    use_sim_time: true
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    transform_tolerance: 0.5
    source_timeout: 5.0                 # s; generous for sim (scan stamps follow /clock)
    base_shift_correction: true         # compensate robot motion between scan time and now
    stop_pub_timeout: 2.0
    polygons: ["PolygonStop", "PolygonSlow"]
    # Humble semantics: an action triggers when more than max_points scan points lie inside the polygon.
    # 3 tolerates isolated noisy returns; a real obstacle yields tens of points at 1 deg/beam.
    PolygonStop:
      type: "polygon"
      # x,y pairs: footprint plus ~8 cm ahead of the front edge (stopping distance at 0.4 m/s is ~6-8 cm)
      points: [0.27, 0.22, 0.27, -0.22, 0.0, -0.22, 0.0, 0.22]
      action_type: "stop"
      max_points: 3
      visualize: true
      polygon_pub_topic: "polygon_stop"
      enabled: true
    PolygonSlow:
      type: "polygon"
      # 0.5 m ahead, +/-0.30 m wide: 0.85 m doorway walls (+/-0.425 m) stay outside, so doorways do not trigger it
      points: [0.50, 0.30, 0.50, -0.30, 0.0, -0.30, 0.0, 0.30]
      action_type: "slowdown"
      max_points: 3
      slowdown_ratio: 0.5
      visualize: true
      polygon_pub_topic: "polygon_slowdown"
      enabled: true
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "/scan"
      enabled: true
