# nav2_amcl parameters (localization)
#
# AMCL estimates the map -> odom transform from the laser scan, the odometry
# (odom -> base_footprint, published by the Gazebo diff-drive plugin) and the
# map published by map_server.
amcl:
  ros__parameters:
    use_sim_time: true

    # ---- Frames & topics -------------------------------------------------
    global_frame_id: "map"
    odom_frame_id: "odom"
    base_frame_id: "base_footprint"
    scan_topic: "scan"
    map_topic: "map"
    tf_broadcast: true
    transform_tolerance: 1.0

    # ---- Initial pose ----------------------------------------------------
    # The robot is spawned at (x=0.0, y=5.0, yaw=0.0) by
    # testbed_gazebo/launch/spawn_testbed.launch.py, so we start AMCL there.
    # It can always be corrected with "2D Pose Estimate" in RViz.
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 5.0
      z: 0.0
      yaw: 0.0
    always_reset_initial_pose: false
    first_map_only: false

    # ---- Motion model (differential drive) -------------------------------
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    alpha1: 0.2   # rot noise from rot
    alpha2: 0.2   # rot noise from trans
    alpha3: 0.2   # trans noise from trans
    alpha4: 0.2   # trans noise from rot
    alpha5: 0.2   # only used by omni model

    # ---- Particle filter -------------------------------------------------
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    # Run a filter update after this much motion
    update_min_d: 0.20
    update_min_a: 0.20
    save_pose_rate: 0.5

    # ---- Laser model -----------------------------------------------------
    # Lidar (testbed.gazebo): 300 beams over 360 deg, 0.10 m .. 12.0 m
    laser_model_type: "likelihood_field"
    laser_min_range: 0.10
    laser_max_range: 12.0
    max_beams: 60
    laser_likelihood_max_dist: 2.0
    z_hit: 0.5
    z_rand: 0.5
    z_max: 0.05
    z_short: 0.05
    sigma_hit: 0.2
    lambda_short: 0.1
    do_beamskip: false
    beam_skip_distance: 0.5
    beam_skip_threshold: 0.3
    beam_skip_error_threshold: 0.9
