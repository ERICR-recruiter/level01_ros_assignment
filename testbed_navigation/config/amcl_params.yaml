amcl:
  ros__parameters:
    use_sim_time: true

    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    global_frame_id: "map"

    scan_topic: "/scan"

    robot_model_type: "nav2_amcl::DifferentialMotionModel"

    max_particles: 2000
    min_particles: 500

    pf_err: 0.05
    pf_z: 0.99

    resample_interval: 1

    transform_tolerance: 1.0

    update_min_a: 0.2
    update_min_d: 0.25

    set_initial_pose: false

    always_reset_initial_pose: false

    tf_broadcast: true

    z_hit: 0.5
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.5

    sigma_hit: 0.2
    lambda_short: 0.1

    laser_likelihood_max_dist: 2.0
    laser_max_range: 5.0
    laser_min_range: 0.1
    laser_model_type: "likelihood_field"
    max_beams: 60
