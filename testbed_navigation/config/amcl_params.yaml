# Parameters for nav2_amcl (used by launch/localization.launch.py)
amcl:
  ros__parameters:
    use_sim_time: True

    # Frames
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    global_frame_id: "map"
    tf_broadcast: true
    transform_tolerance: 1.0

    # Laser topic published by the Gazebo ray sensor on the Testbed
    scan_topic: scan
    laser_model_type: "likelihood_field"
    laser_min_range: -1.0      # -1 = use the range reported in the LaserScan
    laser_max_range: 10.0      # matches <range><max> in testbed.gazebo
    max_beams: 60
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    sigma_hit: 0.2
    laser_likelihood_max_dist: 2.0
    lambda_short: 0.1
    do_beamskip: false
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3

    # Particle filter
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    update_min_d: 0.1
    update_min_a: 0.1
    save_pose_rate: 0.5

    # Motion model (Testbed is a differential-drive robot)
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    # Initial pose = where spawn_testbed.launch.py puts the robot in Gazebo
    # (x=0, y=5, yaw=0). The Gazebo world and the map share the same origin.
    set_initial_pose: true
    always_reset_initial_pose: false
    first_map_only: false
    initial_pose:
      x: 0.0
      y: 5.0
      z: 0.0
      yaw: 0.0
