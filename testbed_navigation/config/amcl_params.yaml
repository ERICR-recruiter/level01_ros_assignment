amcl:
  ros__parameters:
    use_sim_time: true
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: base_footprint
    global_frame_id: map
    odom_frame_id: odom
    scan_topic: /scan
    # The Gazebo spawn launch starts the robot here. This gives AMCL an initial
    # map pose on startup; use RViz's 2D Pose Estimate after moving/restarting
    # the robot elsewhere.
    set_initial_pose: true
    initial_pose.x: 0.0
    initial_pose.y: 5.0
    initial_pose.yaw: 0.0
    robot_model_type: nav2_amcl::DifferentialMotionModel
    laser_model_type: likelihood_field
    laser_min_range: 0.1
    laser_max_range: 1.5
    max_particles: 2000
    min_particles: 500
    max_beams: 60
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_slow: 0.001
    recovery_alpha_fast: 0.1
    resample_interval: 1
    save_pose_rate: 0.5
    transform_tolerance: 1.0
    tf_broadcast: true
    update_min_d: 0.25
    update_min_a: 0.2
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    sigma_hit: 0.2
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
