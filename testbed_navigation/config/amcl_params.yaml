# ------------------------------------------------------------------
# AMCL Localization parameters for Testbed-T1.0.0
# Used by: localization.launch.py
#
# Robot specifics:
#   base_frame  : base_footprint
#   odom_frame  : odom
#   scan_topic  : /scan
#   LiDAR range : 0.10 – 1.5 m  (short range — tuned accordingly)
#   Drive type  : differential
#   Spawn pose  : (0.0, 5.0, 0.0)
# ------------------------------------------------------------------
amcl:
  ros__parameters:
    use_sim_time: true

    # --- Frames ---
    global_frame_id: "map"
    odom_frame_id: "odom"
    base_frame_id: "base_footprint"
    scan_topic: "scan"
    map_topic: "map"

    # --- Particle filter ---
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    transform_tolerance: 1.0
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0

    # --- Motion model (differential drive) ---
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    # --- Laser model ---
    laser_model_type: "likelihood_field"
    laser_max_range: 1.5
    laser_min_range: 0.1
    max_beams: 60
    laser_likelihood_max_dist: 2.0
    sigma_hit: 0.2
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    lambda_short: 0.1

    # --- Update policy ---
    update_min_d: 0.2
    update_min_a: 0.2
    tf_broadcast: true
    save_pose_rate: 0.5

    # --- Initial pose (matches Gazebo spawn) ---
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 5.0
      z: 0.0
      yaw: 0.0
