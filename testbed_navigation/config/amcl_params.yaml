
amcl:
  ros__parameters:
    use_sim_time: true           
    
    base_frame_id: "base_footprint"   
    global_frame_id: "map"
    scan_topic: "scan"                
    tf_broadcast: true                # publish map -> odom
    transform_tolerance: 1.0          

    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

   
    set_initial_pose: true
    always_reset_initial_pose: false
    initial_pose:
      x: 0.0
      y: 5.0
      z: 0.0
      yaw: 0.0

   
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    recovery_alpha_slow: 0.0
    recovery_alpha_fast: 0.0

   
    update_min_d: 0.1                
    update_min_a: 0.1                 

   
    laser_model_type: "likelihood_field"
    
    laser_max_range: 1.5
    laser_min_range: -1.0             
    max_beams: 60                    
    laser_likelihood_max_dist: 2.0
    sigma_hit: 0.2
    z_hit: 0.5
    z_rand: 0.5
    z_max: 0.05
    z_short: 0.05
    do_beamskip: false

    save_pose_rate: 0.5
