# ---------------------------------------------------------------------------
# AMCL (nav2_amcl) - adaptive Monte-Carlo localization of base_footprint in
# the map frame. Publishes the map -> odom transform.
#
# Robot specifics that drove these values:
#   * Differential drive  -> DifferentialMotionModel
#   * 360 deg lidar, 300 samples, 0.10 - 12.0 m (see testbed.gazebo), topic /scan
#   * Gazebo odometry is near-perfect, so the alpha (odom-noise) values are low.
#   * Robot is spawned at (0.0, 5.0, yaw 0) in the Gazebo world which is
#     aligned with the map frame -> used as the initial pose.
# ---------------------------------------------------------------------------
amcl:
  ros__parameters:
    use_sim_time: true

    # --- frames / topics ---
    global_frame_id: "map"
    odom_frame_id: "odom"
    base_frame_id: "base_footprint"
    scan_topic: "scan"
    map_topic: "map"
    tf_broadcast: true
    transform_tolerance: 1.0

    # --- initial pose (matches spawn pose in testbed_gazebo/launch/spawn_testbed.launch.py)
    set_initial_pose: true
    always_reset_initial_pose: false
    initial_pose:
      x: 0.0
      y: 5.0
      z: 0.0
      yaw: 0.0

    # --- motion model ---
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    alpha1: 0.1     # rotation noise from rotation
    alpha2: 0.1     # rotation noise from translation
    alpha3: 0.1     # translation noise from translation
    alpha4: 0.1     # translation noise from rotation
    alpha5: 0.1     # (omni only)

    # --- particle filter ---
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    update_min_d: 0.10        # [m]  filter update after this much translation
    update_min_a: 0.15        # [rad] ...or this much rotation
    save_pose_rate: 0.5

    # --- laser model ---
    laser_model_type: "likelihood_field"
    laser_min_range: 0.10
    laser_max_range: 12.0
    max_beams: 60
    laser_likelihood_max_dist: 2.0
    sigma_hit: 0.2
    z_hit: 0.5
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.5
    lambda_short: 0.1
    do_beamskip: false
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
