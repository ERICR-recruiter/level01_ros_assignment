amcl:
  ros__parameters:
    use_sim_time: true

    # Odometry noise model (differential drive)
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    # Frame and topic configuration matching testbed.gazebo
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    global_frame_id: "map"
    scan_topic: "scan"
    map_topic: "map"
    tf_broadcast: true
    transform_tolerance: 1.0

    # Particle filter bounds
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0

    # Motion update thresholds
    update_min_d: 0.15
    update_min_a: 0.15

    # Laser likelihood field model
    laser_model_type: "likelihood_field"
    laser_likelihood_max_dist: 2.0
    laser_min_range: 0.12
    laser_max_range: 12.0
    max_beams: 60
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    sigma_hit: 0.2
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    lambda_short: 0.1
    save_pose_rate: 0.5

    # Matches spawn pose in testbed_gazebo/launch/spawn_testbed.launch.py ([0.0, 5.0, 0.0])
    # Can still be overridden at runtime using RViz2 "2D Pose Estimate"
    set_initial_pose: true
    always_reset_initial_pose: false
    first_map_only: false
    initial_pose:
      x: 0.0
      y: 5.0
      z: 0.0
      yaw: 0.0
