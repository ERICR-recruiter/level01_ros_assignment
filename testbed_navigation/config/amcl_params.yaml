# Parameters for nav2_amcl (localization.launch.py)
amcl:
  ros__parameters:
    use_sim_time: true
    # Frames: the diff-drive plugin publishes odom -> base_footprint
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    global_frame_id: "map"
    scan_topic: scan
    tf_broadcast: true
    transform_tolerance: 1.0

    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    # Lidar: 300 beams over 360 deg, range 0.1 - 12 m (see BUGS.txt #5)
    laser_model_type: "likelihood_field"
    laser_min_range: 0.1
    laser_max_range: 12.0
    laser_likelihood_max_dist: 2.0
    max_beams: 60
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    sigma_hit: 0.2
    lambda_short: 0.1
    do_beamskip: false
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3

    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    update_min_a: 0.2
    update_min_d: 0.25
    save_pose_rate: 0.5
    # Start from the robot's Gazebo spawn pose (testbed_gazebo/launch/spawn_testbed.launch.py)
    # so the map->odom transform exists immediately. Set to false to use RViz 2D Pose Estimate.
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 5.0
      z: 0.0
      yaw: 0.0
