amcl:
  ros__parameters:
    use_sim_time: true

    min_particles: 500
    max_particles: 2000

    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    laser_model_type: likelihood_field
    laser_min_range: 0.10
    laser_max_range: 1.5
    max_beams: 60

    map_topic: map
    scan_topic: scan

    odom_frame_id: odom
    base_frame_id: base_footprint
    global_frame_id: map

    robot_model_type: "nav2_amcl::DifferentialMotionModel"

    tf_broadcast: true
    transform_tolerance: 1.0

    update_min_d: 0.20
    update_min_a: 0.20

    set_initial_pose: false
    always_reset_initial_pose: false

    z_hit: 0.5
    z_rand: 0.5
