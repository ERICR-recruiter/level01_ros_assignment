# AMCL settings for the Testbed-T1.0.0.
# The URDF publishes the laser scan in lidar_link_1.

amcl:
  ros__parameters:
    use_sim_time: true

    # Frames and scan source
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_footprint
    scan_topic: /scan

    # Particle filter
    min_particles: 300
    max_particles: 1500
    resample_interval: 1
    update_min_d: 0.15
    update_min_a: 0.15

    # 2D LiDAR model
    laser_model_type: "likelihood_field"
    laser_max_range: 10.0
    laser_min_range: 0.12
    laser_likelihood_max_dist: 2.0
    laser_max_beams: 60
    z_hit: 0.5
    z_rand: 0.5
    sigma_hit: 0.2

    # Differential-drive odometry model
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.0

    # Gazebo spawn pose; override with /initialpose or launch arguments.
    set_initial_pose: true
    initial_pose.x: 0.0
    initial_pose.y: 5.0
    initial_pose.z: 0.0
    initial_pose.yaw: 0.0

    tf_broadcast: true
