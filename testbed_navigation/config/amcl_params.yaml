amcl:
  ros__parameters:
    use_sim_time: true
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_footprint
    scan_topic: scan
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    laser_model_type: "likelihood_field"
    laser_max_range: 12.0  # lidar max range (default 100.0)
    laser_min_range: 0.1   # lidar min range (default -1.0 = use scan's value)
    max_beams: 60
    min_particles: 500
    max_particles: 2000
    update_min_d: 0.25
    update_min_a: 0.2
    resample_interval: 1
    transform_tolerance: 1.0
    tf_broadcast: true
    set_initial_pose: true  # start localized at the spawn pose (default false)
    initial_pose:           # Gazebo spawn pose; map and world frames are aligned
      x: 0.0
      y: 5.0
      z: 0.0
      yaw: 0.0
