# nav2_amcl parameters for Testbed-T1.0.0 (differential drive, 360 deg 2D lidar on /scan).
amcl:
  ros__parameters:
    use_sim_time: true

    # ---- Frames / topics ----------------------------------------------------
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_footprint
    scan_topic: scan
    map_topic: map
    tf_broadcast: true            # publish map -> odom
    transform_tolerance: 1.0

    # ---- Initial pose ---------------------------------------------------------
    # The robot is spawned at (0, 5, yaw 0) in Gazebo (testbed_gazebo/spawn_testbed.launch.py)
    # and the map frame coincides with the Gazebo world frame, so AMCL can start there
    # without the user clicking "2D Pose Estimate".
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 5.0
      z: 0.0
      yaw: 0.0
    always_reset_initial_pose: false
    first_map_only: false

    # ---- Motion model ---------------------------------------------------------
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    alpha1: 0.2   # rotation noise from rotation
    alpha2: 0.2   # rotation noise from translation
    alpha3: 0.2   # translation noise from translation
    alpha4: 0.2   # translation noise from rotation
    alpha5: 0.2   # (omni only)

    # ---- Particle filter ------------------------------------------------------
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    update_min_d: 0.20            # filter update after 20 cm ...
    update_min_a: 0.20            # ... or ~11 deg of motion
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    save_pose_rate: 0.5

    # ---- Laser model ----------------------------------------------------------
    laser_model_type: "likelihood_field"
    laser_min_range: 0.12         # matches the Gazebo ray sensor
    laser_max_range: 12.0
    max_beams: 60
    laser_likelihood_max_dist: 2.0
    sigma_hit: 0.2
    z_hit: 0.5
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.5
    lambda_short: 0.1
    do_beamskip: false
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
