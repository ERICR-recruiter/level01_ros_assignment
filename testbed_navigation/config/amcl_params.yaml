amcl:
  ros__parameters:
    use_sim_time: true
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"   # matches diff_drive robot_base_frame
    odom_frame_id: "odom"
    global_frame_id: "map"
    scan_topic: scan
    map_topic: map
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    laser_max_range: 10.0
    laser_min_range: -1.0
    laser_likelihood_max_dist: 2.0
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    sigma_hit: 0.2
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    update_min_a: 0.2
    update_min_d: 0.25
    tf_broadcast: true
    transform_tolerance: 1.0
    save_pose_rate: 0.5
    set_initial_pose: false           # use RViz "2D Pose Estimate"
    always_reset_initial_pose: false
    initial_pose: {x: 0.0, y: 0.0, z: 0.0, yaw: 0.0}
