amcl:
  ros__parameters:
    use_sim_time: true

    # Frames — must match the TF tree published by the diff_drive gazebo
    # plugin (odom_frame/robot_base_frame) in testbed.gazebo.
    global_frame_id: "map"
    odom_frame_id: "odom"
    base_frame_id: "base_footprint"
    scan_topic: "scan"

    # Robot is spawned at (x=0.0, y=5.0, yaw=0.0) by
    # testbed_gazebo/launch/spawn_testbed.launch.py, so seed AMCL there
    # instead of the map origin.
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 5.0
      z: 0.0
      yaw: 0.0

    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    laser_max_range: 12.0
    laser_min_range: 0.1
    laser_model_type: "likelihood_field"
    max_beams: 60

    min_particles: 500
    max_particles: 2000
    update_min_a: 0.2
    update_min_d: 0.25
    resample_interval: 1

    robot_model_type: "nav2_amcl::DifferentialMotionModel"

    tf_broadcast: true
    transform_tolerance: 1.0

    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_slow: 0.0
    recovery_alpha_fast: 0.0

    always_reset_initial_pose: false
    first_map_only: false
    do_beamskip: false
