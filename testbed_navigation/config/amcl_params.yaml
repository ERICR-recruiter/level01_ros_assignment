amcl:
  ros__parameters:
    use_sim_time: True

    # frames
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    global_frame_id: "map"

    #sensors and robot motion model
    scan_topic: scan
    laser_model_type: "likelihood_field"
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    laser_max_range: 12.0
    laser_min_range: -1.0
    max_beams: 60

    #particle filter
    min_particles: 500
    max_particles: 2000
    update_min_d: 0.25
    update_min_a: 0.2
    resample_interval: 1

    #starting pose for robot 

    set_initial_pose: True
    initial_pose:
        x: 0.0
        y: 5.0
        z: 0.0
        yaw: 0.0

    #publishing the map
    tf_broadcast: True
    transform_tolerance: 1.0
