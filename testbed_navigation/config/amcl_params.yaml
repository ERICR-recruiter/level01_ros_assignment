amcl:
  ros__parameters:
    use_sim_time: true

    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    global_frame_id: "map"

    scan_topic: /scan

    laser_model_type: "likelihood_field"
    laser_min_range: 0.1
    laser_max_range: 1.5
    max_beams: 60
    sigma_hit: 0.2
    z_hit: 0.5
    z_rand: 0.5
    z_max: 0.05
    z_short: 0.05
    lambda_short: 0.1

    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99

    robot_model_type: "nav2_amcl::DifferentialMotionModel"

    resample_interval: 1
    transform_tolerance: 1.0
    tf_broadcast: true

    update_min_d: 0.25
    update_min_a: 0.2

    do_beamskip: false
    save_pose_rate: 0.5
