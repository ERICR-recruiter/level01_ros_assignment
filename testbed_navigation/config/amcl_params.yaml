
amcl:
  ros__parameters:
    use_sim_time: true

    # Coordinate frames
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_footprint

    # Sensor topic
    scan_topic: /scan

    # Robot motion model
    robot_model_type: "nav2_amcl::DifferentialMotionModel"

    # Particle filter
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1

    # Motion update thresholds
    update_min_d: 0.25
    update_min_a: 0.2

    # Laser model
    laser_model_type: likelihood_field
    laser_min_range: 0.1
    laser_max_range: 1.5
    max_beams: 60
    laser_likelihood_max_dist: 2.0

    # Sensor model parameters
    sigma_hit: 0.2
    z_hit: 0.5
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.5

    # Transform settings
    tf_broadcast: true
    transform_tolerance: 1.0

    # Initial pose will be set in RViz
    set_initial_pose: false
