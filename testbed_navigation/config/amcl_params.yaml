amcl:
  ros__parameters:
    use_sim_time: True

    # Frames and topics
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    global_frame_id: "map"
    scan_topic: scan
    tf_broadcast: true

    # Particle filter
    min_particles: 1000
    max_particles: 5000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    recovery_alpha_slow: 0.0
    recovery_alpha_fast: 0.0
    update_min_d: 0.05
    update_min_a: 0.1
    transform_tolerance: 1.0
    save_pose_rate: 0.5
    first_map_only: false

    # Initial pose (robot spawns at about x=0, y=5)
    set_initial_pose: true
    always_reset_initial_pose: false
    initial_pose:
      x: 0.0
      y: 5.0
      z: 0.0
      yaw: 0.0

    # Laser model
    laser_model_type: "likelihood_field"
    laser_min_range: -1.0
    laser_max_range: 1.5     # lidar max range in testbed.gazebo is 1.5 m
    max_beams: 120
    z_hit: 0.9
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.1
    sigma_hit: 0.1
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    do_beamskip: false

    # Odometry model (differential drive)
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    alpha1: 0.05
    alpha2: 0.05
    alpha3: 0.05
    alpha4: 0.05
    alpha5: 0.0