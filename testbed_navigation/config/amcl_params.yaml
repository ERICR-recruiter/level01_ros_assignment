amcl:
  ros__parameters:
    use_sim_time: true

    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_footprint
    scan_topic: scan

    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    laser_model_type: likelihood_field

    # Gazebo publishes world-based odometry, so use modest motion uncertainty.
    alpha1: 0.01
    alpha2: 0.01
    alpha3: 0.01
    alpha4: 0.01

    # Correct the estimate frequently during slow teleoperation.
    update_min_d: 0.05
    update_min_a: 0.05

    min_particles: 500
    max_particles: 2000
    max_beams: 120

    tf_broadcast: true
    transform_tolerance: 0.2
    laser_max_range: 8.0
